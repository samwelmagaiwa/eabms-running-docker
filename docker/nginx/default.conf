server {
    listen 80;
    server_name eabms.mloganzila.or.tz;
    index index.html index.php;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Root directory will contain the frontend 'dist' build
    root /var/www/public;

    # Handle API routes and Documentation routes by passing to Laravel index.php
    location ~ ^/(api|api-docs-modern|documentation|swagger-assets) {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Serve storage assets with CORS headers
    location /storage {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        try_files $uri $uri/ =404;
    }

    # Handle standard PHP files
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Handle Frontend (Vue SPA) routes
    location / {
        # First try to serve static file, then fall back to index.html for SPA routing
        try_files $uri $uri/ /index.html;
        gzip_static on;
    }

    # Prevent index.html from being cached so browser always gets fresh version
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Cache hashed JS/CSS assets aggressively (they have content hashes in filename)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
